name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend（单测 + Testcontainers 集成测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: 后端单元测试与集成测试（Maven Wrapper）
        run: |
          chmod +x backend/mvnw
          ./backend/mvnw -B -f backend/pom.xml verify

      - name: 上传后端测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend（类型检查 + Vitest + 生产构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: TypeScript 类型检查
        working-directory: frontend
        run: npm run type-check

      - name: Vitest 单元测试
        working-directory: frontend
        run: npm test

      - name: 前端生产构建
        working-directory: frontend
        run: npm run build

  e2e:
    name: Playwright E2E（真实浏览器 + 截图 + 生产构建防护）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 安装 Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright 端到端测试与截图
        working-directory: frontend
        run: npm run test:e2e

      - name: 生产构建防护（/dev/design-system 不可用）
        working-directory: frontend
        run: npm run test:e2e:prod

      - name: 上传 Playwright 报告与截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-and-screenshots
          path: |
            frontend/playwright-report/
            frontend/test-results/
            artifacts/screenshots/phase-0.1.1/
          if-no-files-found: ignore

  compose-config:
    name: Docker Compose 配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 docker-compose 配置
        run: |
          cp .env.example .env
          docker compose config --quiet
