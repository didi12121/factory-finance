spring:
  application:
    name: factory-finance
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 默认关闭 baseline-on-migrate：禁止任何隐式基线行为；
    # 已有非空 schema 的数据库必须经人工审核迁移历史后再启用。
    baseline-on-migrate: false
    validate-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    encoding:
      charset: UTF-8
      force: true
    multipart:
      # Excel 导入：单文件上限 10MB，请求上限 12MB（模板单次最多 5000 行）
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{40} - %msg%n"
